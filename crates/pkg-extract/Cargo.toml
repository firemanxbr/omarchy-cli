[package]
name = "pkg-extract"
description = "Inspects .pkg.tar.zst archives and extracts ABI metadata (sonames, symbol versions) into a PackageManifest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pkg-extract"
path = "src/main.rs"

[dependencies]
pkg-manifest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Archive handling
tar = "0.4"
zstd = "0.13"
xz2 = "0.1"
# ELF parsing
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
tar = "0.4"
zstd = "0.13"
