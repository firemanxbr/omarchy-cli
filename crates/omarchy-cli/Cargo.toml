[package]
name = "omarchy-cli"
description = "Package manager for the Omarchy repository"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "omarchy-cli"
path = "src/main.rs"

[dependencies]
pkg-manifest = { workspace = true }
pkg-extract = { workspace = true }
pkg-resolver = { workspace = true }
pkg-store = { workspace = true }
pkg-hooks = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
toml = "0.9"

[lints]
workspace = true
