name: Package request
description: Ask the factory to package a project that no repository ships yet.
title: "Package request: "
labels: [package-request]
body:
  - type: markdown
    attributes:
      value: |
        Paste the project's URL. The pool reads open requests every ten minutes: it checks whether Arch, Arch Linux ARM or the OPR already ship the name, then queues a build with a drafted PKGBUILD for a shared community worker whose owner runs an agent. The result is evidence a maintainer of the group reviews on the dashboard; if it is approved, the project rebuilds it and it enters the pool. Follow it on the Factory page. If you can run a worker yourself, sign in on Contributors and register the package instead — it is the same flow, on your machine.
  - type: input
    id: url
    attributes:
      label: Project URL
      description: A GitHub repository with releases (tags). Other hosts need a hand-written PKGBUILD for now.
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Package name (optional)
      description: pacman name if it should differ from the repository name (lowercase).
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: Who reviews it (CODEOWNERS per group).
      options: [community, omarchy]
      default: 0
  - type: textarea
    id: notes
    attributes:
      label: Notes for the packager (optional)
      description: Anything the PKGBUILD should know — dependencies, build flags, what to install.
