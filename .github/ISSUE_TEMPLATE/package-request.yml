name: Package request
description: Ask the factory to package a project that no repository ships yet.
title: "Package request: "
labels: [package-request]
body:
  - type: markdown
    attributes:
      value: |
        Paste the project's URL. The factory checks whether Arch, Arch Linux ARM or the OPR already ship it, drafts a PKGBUILD, builds it as a dry run on x86_64 and aarch64 and opens a pull request for a maintainer to approve. You will be mentioned on that pull request.
  - type: input
    id: url
    attributes:
      label: Project URL
      description: A GitHub repository with releases (tags). Other hosts need a hand-written PKGBUILD for now.
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Package name (optional)
      description: pacman name if it should differ from the repository name (lowercase).
  - type: dropdown
    id: group
    attributes:
      label: Group
      description: Who reviews it (CODEOWNERS per group).
      options: [community, omarchy]
      default: 0
  - type: textarea
    id: notes
    attributes:
      label: Notes for the packager (optional)
      description: Anything the PKGBUILD should know — dependencies, build flags, what to install.
