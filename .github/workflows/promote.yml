name: Promote

# Moves a ring's selection forward (index write, zero bytes copied), renders the
# target ring's databases, then runs the health check against it.
on:
  schedule:
    - cron: "0 6 * * *"      # edge → rc, daily
    - cron: "0 7 * * 1"      # rc → stable, Mondays
  workflow_dispatch:
    inputs:
      from:
        description: "Source ring"
        default: "edge"
      to:
        description: "Target ring"
        default: "rc"
      note:
        description: "Release note"
        default: ""

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OMARCHY_API: ${{ vars.OMARCHY_API }}
  OMARCHY_POOL: ${{ vars.OMARCHY_POOL }}
  OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}

jobs:
  promote:
    runs-on: ubuntu-latest
    # Promotions into stable wait for a human approval (GitHub environment
    # `stable`, required reviewer); edge → rc is automatic.
    environment: ${{ (github.event.inputs.to == 'stable' || github.event.schedule == '0 7 * * 1') && 'stable' || 'automatic' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-repo
      - name: Import signing key
        run: |
          echo "${{ secrets.OMARCHY_GPG_KEY }}" | gpg --batch --import
          echo "OMARCHY_GPG_KEYID=${{ secrets.OMARCHY_GPG_KEYID }}" >> "$GITHUB_ENV"
      - name: Decide rings
        id: rings
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 7 * * 1" ]]; then echo "from=rc" >> "$GITHUB_OUTPUT"; echo "to=stable" >> "$GITHUB_OUTPUT"; echo "note=weekly stable" >> "$GITHUB_OUTPUT";
            else echo "from=edge" >> "$GITHUB_OUTPUT"; echo "to=rc" >> "$GITHUB_OUTPUT"; echo "note=daily rc" >> "$GITHUB_OUTPUT"; fi
          else
            echo "from=${{ github.event.inputs.from }}" >> "$GITHUB_OUTPUT"; echo "to=${{ github.event.inputs.to }}" >> "$GITHUB_OUTPUT"; echo "note=${{ github.event.inputs.note }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Promote
        run: target/release/pkg-repo promote --from "${{ steps.rings.outputs.from }}" --to "${{ steps.rings.outputs.to }}" --note "${{ steps.rings.outputs.note }}"
      - name: Render
        run: |
          for arch in x86_64 aarch64; do
            target/release/pkg-repo render --ring "${{ steps.rings.outputs.to }}" --arch "$arch" --sign "$OMARCHY_GPG_KEYID"
          done
      - name: Health check the target ring (x86_64)
        run: tests/health-check.sh "${{ steps.rings.outputs.to }}" x86_64
  health-aarch64:
    needs: promote
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-repo
      - name: Decide ring
        id: rings
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${{ github.event.schedule }}" == "0 7 * * 1" ]]; then echo "to=stable" >> "$GITHUB_OUTPUT"; else echo "to=rc" >> "$GITHUB_OUTPUT"; fi
          else echo "to=${{ github.event.inputs.to }}" >> "$GITHUB_OUTPUT"; fi
      - run: tests/health-check.sh "${{ steps.rings.outputs.to }}" aarch64
