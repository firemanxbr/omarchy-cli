name: Health

# A real pacman, in a container, syncs every ring from the pool and downloads a
# package with signature verification. The result lands on the dashboard.
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OMARCHY_API: ${{ vars.OMARCHY_API }}
  OMARCHY_POOL: ${{ vars.OMARCHY_POOL }}
  OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}

jobs:
  health:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-repo
      - run: |
          for ring in edge rc stable; do tests/health-check.sh "$ring" "${{ matrix.arch }}" || true; done
