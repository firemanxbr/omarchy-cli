name: Factory update

# Once a package is approved, new upstream releases need no human: this
# checks every PKGBUILD's GitHub upstream, bumps pkgver (pkgrel back to 1),
# refreshes the checksums in an Arch container and opens one pull request
# per package with auto-merge on. CI is the only gate a bump passes; the
# merge queues the build (factory-enqueue.yml, or its hourly reconcile).
# Runs daily from the pool's scheduler.
#
# Needs two repository settings: Actions may create pull requests, and
# auto-merge is allowed (RUNBOOK, The factory).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "group/name to check — empty checks everything"
        required: false
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    name: Bump what upstream released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstreams
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          factory/bin/check-updates > /tmp/updates || true
          if [[ -n "${{ inputs.package }}" ]]; then grep "^${{ inputs.package }} " /tmp/updates > /tmp/only || true; mv /tmp/only /tmp/updates; fi
          cat /tmp/updates
          echo "count=$(wc -l < /tmp/updates | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Bump, refresh checksums, open pull requests
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "omarchy-pool factory"
          git config user.email "factory@omarchy-pool.invalid"
          while read -r pkg current latest; do
            dir="factory/pkgbuilds/$pkg"; name="${pkg#*/}"; branch="factory/bump-$name-$latest"
            if gh pr list --head "$branch" --state open --json number -q 'length' | grep -qv '^0$'; then echo "$pkg $latest: pull request already open"; continue; fi
            git checkout -q -B "$branch" origin/main
            sed -i -E "s/^pkgver=.*/pkgver=$latest/; s/^pkgrel=.*/pkgrel=1/" "$dir/PKGBUILD"
            # updpkgsums downloads the sources and rewrites the sha256sums arrays.
            docker run --rm -v "$PWD/$dir:/pkg" -w /pkg docker.io/library/archlinux:base-devel bash -c '
              sed -i -e "s/^#\?DisableSandboxSyscalls/DisableSandboxSyscalls/" -e "s/^#\?DisableSandboxFilesystem/DisableSandboxFilesystem/" /etc/pacman.conf
              pacman -Sy --noconfirm --needed pacman-contrib >/dev/null && useradd -m b && chown -R b /pkg && sudo -u b updpkgsums' 2>&1 | tail -3
            git add "$dir" && git commit -qm "factory: $name $current → $latest

Automatic bump of an approved package after an upstream release." || { echo "$pkg: nothing changed"; continue; }
            git push -q -f origin "$branch"
            url="$(gh pr create --base main --head "$branch" --title "factory: $name $current → $latest" \
              --body "Upstream released **$latest** (this PKGBUILD had $current). pkgver bumped, pkgrel reset, checksums refreshed with updpkgsums. Opened by the Factory update workflow; auto-merge is on — CI is the gate, the merge queues the build.")"
            echo "$pkg: $url"
            # A pull request opened with the workflow token does not start
            # pull_request workflows by itself; run the required checks on the branch.
            gh workflow run ci.yml --ref "$branch" || true
            gh workflow run e2e.yml --ref "$branch" || true
            gh pr merge --auto --squash "$url" || echo "::warning::auto-merge not enabled; merge $url by hand"
          done < /tmp/updates
