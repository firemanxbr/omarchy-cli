name: Security

# Every three hours: fetch the public vulnerability sources and match them
# against what the rings serve. Arch Security Tracker (exact, Arch's own
# versions), Debian Security Tracker (same upstream projects, for CVEs Arch
# has no advisory for), CISA KEV (exploited in the wild) and FIRST EPSS
# (probability of exploitation). Results land in the index; the dashboard's
# Security page and every package page read them.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

concurrency:
  group: security
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OMARCHY_API: ${{ vars.OMARCHY_API }}
  OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-repo
      - name: Fetch the sources
        run: |
          set -euo pipefail
          mkdir -p feeds
          curl -sfL -A omarchy-pool https://security.archlinux.org/issues/all.json -o feeds/arch.json
          curl -sfL -A omarchy-pool https://security-tracker.debian.org/tracker/data/json -o feeds/debian.json
          curl -sfL -A omarchy-pool https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o feeds/kev.json
          curl -sfL -A omarchy-pool https://epss.cyentia.com/epss_scores-current.csv.gz | gunzip -c > feeds/epss.csv
          ls -la feeds
      - name: Match and record
        run: target/release/pkg-repo security --arch-tracker feeds/arch.json --debian feeds/debian.json --kev feeds/kev.json --epss feeds/epss.csv
      - name: Report failure
        if: failure()
        run: |
          target/release/pkg-repo event --kind security --status error \
            --summary "security run ${{ github.run_id }} failed — see Actions log" --payload '{}' || true
