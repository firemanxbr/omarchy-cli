name: Factory image

# Builds and signs the Omarchy Packaging image — the contributor's worker —
# for x86_64 and aarch64 whenever the worker, the drafter or the image
# definition change. Signed keyless with cosign (GitHub OIDC), so anyone can
# check the image they run is the project's.

on:
  push:
    branches: [main]
    paths: ["factory/image/**", "factory/worker/**", "factory/bin/**", "factory/prompts/**", ".github/workflows/factory-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omarchy-packaging

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            base: docker.io/library/archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: docker.io/menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          tag="$IMAGE:${{ matrix.arch }}"
          docker build -f factory/image/Containerfile --build-arg BASE="${{ matrix.base }}" -t "$tag" -t "$tag-${GITHUB_SHA::7}" .
          docker push "$tag"; docker push "$tag-${GITHUB_SHA::7}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d@ -f2)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
  manifest:
    name: latest (both architectures)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish the multi-arch tag and sign it
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:x86_64" "$IMAGE:aarch64"
          digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "$IMAGE@$digest"
