name: Factory worker
run-name: Build worker (${{ inputs.arch }})

# One ephemeral build worker on a GitHub-hosted runner — free on a public
# repository, x86_64 and aarch64 natively. It is not the orchestrator: the
# pool's scheduler starts it when tasks are queued and no worker of that
# architecture is alive, and it asks Cloudflare for work like any other
# worker (factory/worker/omarchy-build-worker.sh). It exits after a few
# minutes without work; the job cap keeps a stuck build from running a run
# for six hours.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture to build for
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      idle_exit:
        description: Seconds without work before the worker exits
        default: "300"

jobs:
  worker:
    name: ${{ inputs.arch }} worker
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Build until the queue is empty
        env:
          OMARCHY_API: ${{ vars.OMARCHY_API }}
          OMARCHY_POOL: ${{ vars.OMARCHY_POOL }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}
          OMARCHY_GPG_KEY: ${{ secrets.OMARCHY_GPG_KEY }}
          OMARCHY_GPG_KEYID: ${{ secrets.OMARCHY_GPG_KEYID }}
          IMAGE: ${{ inputs.arch == 'aarch64' && 'docker.io/menci/archlinuxarm:base-devel' || 'docker.io/library/archlinux:base-devel' }}
        run: |
          docker run --rm \
            -e OMARCHY_API -e OMARCHY_POOL -e FACTORY_TOKEN -e OMARCHY_PUBLISH_TOKEN -e OMARCHY_GPG_KEY -e OMARCHY_GPG_KEYID \
            -e WORKER_ID="gh-${{ inputs.arch }}-${{ github.run_id }}" \
            -e WORKER_LABELS='{"where":"github-hosted","runner":"${{ runner.name }}","run":"${{ github.run_id }}"}' \
            -e IDLE_EXIT="${{ inputs.idle_exit }}" \
            -v "$PWD/factory/worker/omarchy-build-worker.sh:/usr/local/bin/omarchy-build-worker:ro" \
            "$IMAGE" omarchy-build-worker
