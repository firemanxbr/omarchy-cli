name: Sync

# Imports every upstream repository into the pool and pins it on a ring, then
# renders the rings that changed. Arch, Arch Linux ARM and chaotic-aur feed
# `edge` (promotion carries them forward); the OPR has its own edge / rc /
# stable channels (x86_64 only — aarch64 has just edge), so each is synced
# straight into the matching ring — the pool's rc and stable serve what
# Omarchy promoted, not the OPR edge. Hourly; a manual run can import
# everything at once.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source ids (see SOURCES in the job), or 'all'"
        default: "all"
      limit:
        description: "Max new packages per source (0 = all)"
        default: "0"
      concurrency:
        description: "Parallel downloads/uploads"
        default: "8"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  OMARCHY_API: ${{ vars.OMARCHY_API }}
  OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkg-repo
      - name: Import signing key
        run: |
          echo "${{ secrets.OMARCHY_GPG_KEY }}" | gpg --batch --import
          echo "OMARCHY_GPG_KEYID=${{ secrets.OMARCHY_GPG_KEYID }}" >> "$GITHUB_ENV"
      - name: Fetch upstream keyrings
        # Every imported package must carry a signature by a key in the upstream
        # project's keyring: archlinux.gpg (from the archlinux-keyring package),
        # archlinuxarm.gpg (archlinuxarm-keyring) and Omarchy's omarchy.gpg.
        run: tests/fetch-keyrings.sh "$RUNNER_TEMP/keyrings"
      - name: Sync sources
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/keyrings"
          # id | source | arch | ring | directory holding <db>.db and the packages | db name | keyring | defer-to (sources that win a name, comma-separated, or -)
          SOURCES="
          core-x86_64         core      x86_64  edge   https://mirror.omarchy.org/core/os/x86_64                core        $K/archlinux.gpg     -
          multilib-x86_64     multilib  x86_64  edge   https://mirror.omarchy.org/multilib/os/x86_64            multilib    $K/archlinux.gpg     -
          extra-x86_64        extra     x86_64  edge   https://mirror.omarchy.org/extra/os/x86_64               extra       $K/archlinux.gpg     -
          packages-x86_64     packages  x86_64  edge   https://pkgs.omarchy.org/edge/x86_64                     omarchy     $K/omarchy.gpg       -
          packages-x86_64-rc  packages  x86_64  rc     https://pkgs.omarchy.org/rc/x86_64                       omarchy     $K/omarchy.gpg       -
          packages-x86_64-st  packages  x86_64  stable https://pkgs.omarchy.org/stable/x86_64                   omarchy     $K/omarchy.gpg       -
          chaotic-x86_64      chaotic   x86_64  edge   https://builds.garudalinux.org/repos/chaotic-aur/x86_64  chaotic-aur $K/chaotic.gpg       core,extra,multilib,packages
          core-aarch64        core      aarch64 edge   http://os.archlinuxarm.org/aarch64/core                  core        $K/archlinuxarm.gpg  -
          alarm-aarch64       alarm     aarch64 edge   http://os.archlinuxarm.org/aarch64/alarm                 alarm       $K/archlinuxarm.gpg  -
          extra-aarch64       extra     aarch64 edge   http://os.archlinuxarm.org/aarch64/extra                 extra       $K/archlinuxarm.gpg  -
          packages-aarch64    packages  aarch64 edge   https://pkgs.omarchy.org/edge/aarch64                    omarchy     $K/omarchy.gpg       -
          packages-aarch64-rc packages  aarch64 rc     https://pkgs.omarchy.org/edge/aarch64                    omarchy     $K/omarchy.gpg       -
          packages-aarch64-st packages  aarch64 stable https://pkgs.omarchy.org/edge/aarch64                    omarchy     $K/omarchy.gpg       -
          "
          WANT="${{ github.event.inputs.sources || 'all' }}"
          LIMIT="${{ github.event.inputs.limit || '1500' }}"
          status=0
          touched=""
          while read -r id source arch ring base db keyring defer; do
            [[ -z "$id" ]] && continue
            if [[ "$WANT" != "all" ]] && ! grep -qw "$id" <<<"$WANT"; then continue; fi
            args=()
            if [[ "$defer" != "-" ]]; then for d in ${defer//,/ }; do args+=(--defer-to "$d"); done; fi
            echo "::group::sync $id → $ring"
            if target/release/pkg-repo sync --source "$source" --arch "$arch" --base-url "$base" --db-name "$db" \
                 --keyring "$keyring" --ring "$ring" --limit "$LIMIT" "${args[@]}" \
                 --concurrency "${{ github.event.inputs.concurrency || '6' }}" \
                 --work-dir "$RUNNER_TEMP/sync" | tee "$RUNNER_TEMP/sync-$id.log"; then :; else status=$?; fi
            grep -q "^release id" "$RUNNER_TEMP/sync-$id.log" && touched="$touched $ring"
            echo "::endgroup::"
          done <<<"$SOURCES"
          echo "TOUCHED=$(tr ' ' '\n' <<<"$touched" | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"
          exit $status
      - name: Render the rings that changed
        # A new release is the head for both architectures, so both are
        # rendered even when only one architecture's source moved.
        if: always()
        run: |
          for ring in $TOUCHED; do for arch in x86_64 aarch64; do
            target/release/pkg-repo render --ring "$ring" --arch "$arch" --sign "$OMARCHY_GPG_KEYID"
          done; done
          [[ -z "$TOUCHED" ]] && echo "nothing changed; nothing to render" || true
      - name: Report failure
        if: failure()
        run: |
          target/release/pkg-repo event --kind sync --ring edge --status error \
            --summary "sync run ${{ github.run_id }} failed — see Actions log" \
            --payload "{\"run\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
