name: Factory enqueue

# Reconciles the PKGBUILDs on main with what the factory has built: every
# (package, architecture, version) without a task yet is queued at this
# commit. Runs on every merge that touches a PKGBUILD and hourly from the
# pool's scheduler, so a merge no push event announced (a bot's auto-merge,
# a deploy in progress) is still built within the hour. Review happens on
# the pull request (CODEOWNERS of factory/pkgbuilds/<group>); this only
# tells the brain what to build.

on:
  push:
    branches: [main]
    paths: ["factory/pkgbuilds/**/PKGBUILD"]
  workflow_dispatch:
    inputs:
      package:
        description: "group/name to (re)queue — empty reconciles everything"
        required: false
      force:
        description: Queue even if a task for this version exists (a rebuild)
        type: boolean
        default: false
      override:
        description: Build even if an upstream source ships this name
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  enqueue:
    name: Reconcile PKGBUILDs with the queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enqueue what has no task yet
        env:
          OMARCHY_API: ${{ vars.OMARCHY_API }}
          OMARCHY_PUBLISH_TOKEN: ${{ secrets.OMARCHY_PUBLISH_TOKEN }}
          ONLY: ${{ inputs.package }}
          FORCE: ${{ inputs.force || 'false' }}
          OVERRIDE: ${{ inputs.override || 'false' }}
        run: |
          set -euo pipefail
          built="$(curl -sS --fail-with-body "$OMARCHY_API/api/v1/factory/built")"
          queued=0
          for pkgbuild in factory/pkgbuilds/*/*/PKGBUILD; do
            dir="$(dirname "$pkgbuild")"; group="$(basename "$(dirname "$dir")")"; name="$(basename "$dir")"
            [[ -z "$ONLY" || "$ONLY" == "$group/$name" ]] || continue
            eval "$(factory/bin/pkgbuild-meta "$pkgbuild")"   # META_ARCHES, META_VERSION
            if [[ "$FORCE" == "true" ]]; then arches="$META_ARCHES"; else
              arches="$(jq -c --arg n "$name" --arg v "$META_VERSION" --argjson a "$META_ARCHES" \
                '[.built[] | select(.name == $n and .version == $v) | .arch] as $have | $a - $have' <<<"$built")"
            fi
            if [[ "$arches" == "[]" ]]; then echo "$group/$name $META_VERSION: nothing to queue"; continue; fi
            printf '%s/%s %s → %s: ' "$group" "$name" "$META_VERSION" "$arches"
            body="$(jq -n --arg n "$name" --arg g "$group" --arg r "$GITHUB_SHA" --arg v "$META_VERSION" --argjson a "$arches" --argjson o "$OVERRIDE" \
              '{name:$n, group:$g, pkgbuild_ref:$r, version:$v, arches:$a, reason:"pkgbuild-changed", override:$o}')"
            code="$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$OMARCHY_API/api/v1/factory/enqueue" \
              -H "authorization: Bearer $OMARCHY_PUBLISH_TOKEN" -H "content-type: application/json" --data "$body")"
            case "$code" in
              201) echo "queued $(jq -c '{tasks, skipped}' /tmp/resp)"; queued=$((queued + 1)) ;;
              409) echo "skipped — $(jq -r .error /tmp/resp)" ;;
              *)   echo "HTTP $code $(cat /tmp/resp)"; exit 1 ;;
            esac
          done
          echo "$queued package(s) queued"
