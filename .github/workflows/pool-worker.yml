name: Pool worker
run-name: Pool worker (${{ inputs.arch }})

# A project worker on a GitHub-hosted runner, started by the pool's
# scheduler when pool jobs (sync, promote, health, gc) are queued and no
# project worker is idle. It is a worker, not an orchestrator: it pulls
# jobs from the pool and runs each with the per-job credential the pool
# hands out. Any machine the project trusts does the same with
# `pkg-repo work`; this is the fallback fleet, free on a public repository.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture to work for
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      idle_exit:
        description: Seconds without work before the worker exits
        default: "300"

jobs:
  worker:
    name: ${{ inputs.arch }} pool worker
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Containers of the other architecture (health and ABI evidence on both)
        run: docker run --privileged --rm tonistiigi/binfmt --install all >/dev/null
      - name: pkg-repo and omarchy-cli from the latest release
        run: |
          set -euo pipefail
          tag="$(curl -sS -H "authorization: Bearer ${{ github.token }}" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)"
          name="omarchy-pool-$tag-${{ inputs.arch }}-linux"
          curl -sSL -o "$name.tar.gz" "https://github.com/${{ github.repository }}/releases/download/$tag/$name.tar.gz"
          curl -sSL -o "$name.tar.gz.sha256" "https://github.com/${{ github.repository }}/releases/download/$tag/$name.tar.gz.sha256"
          sha256sum -c "$name.tar.gz.sha256"
          tar -xzf "$name.tar.gz" && mkdir -p bin && cp "$name"/* bin/ && echo "$PWD/bin" >> "$GITHUB_PATH"
          echo "$tag"
      - name: Work until the queue is empty
        env:
          OMARCHY_API: ${{ vars.OMARCHY_API }}
          OMARCHY_POOL: ${{ vars.OMARCHY_POOL }}
          OMARCHY_WORKER_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          WORKER_ID: gh-pool-${{ inputs.arch }}-${{ github.run_id }}
        run: |
          pkg-repo work --arch "${{ inputs.arch }}" --idle-exit "${{ inputs.idle_exit }}" --repo-dir "$PWD" --work-dir "$RUNNER_TEMP/pool-worker" \
            --labels '{"where":"github-hosted","runner":"${{ runner.name }}","run":"${{ github.run_id }}"}'
