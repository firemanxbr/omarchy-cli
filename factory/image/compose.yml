# A contributor's worker: `podman compose up -d` (or docker compose).
# Every restart is a new container from the signed image — one task each.
services:
  worker:
    image: ghcr.io/firemanxbr/omarchy-packaging:latest
    restart: unless-stopped
    environment:
      WORKER_ID: ${WORKER_ID:?from POST /api/v1/factory/workers}
      FACTORY_TOKEN: ${FACTORY_TOKEN:?the worker token, shown once}
      WORKER_LABELS: '{"where":"${WHERE:-my-machine}"}'
      # Optional: your own agent drafts and corrects PKGBUILDs (your tokens, your cost).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: raises GitHub API limits when drafting.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
