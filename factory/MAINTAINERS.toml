# Who maintains what in the Omarchy pool's factory.
#
# This file is the governance record. Every login listed under a group is a
# maintainer of that group: they approve the builds staged for it, they
# trust workers, and they review changes to factory/pkgbuilds/<group>/.
# Everyone else who signs in is a contributor. There is no other role and
# no other way to become a maintainer.
#
# Changing this file — a new maintainer, a new group, a departure — is a
# decision people make, in a pull request that at least one *other*
# maintainer approves (CODEOWNERS + branch protection; never auto-merged).
# The pool reads main every ten minutes and applies it.
#
# Bootstrap: while there is a single maintainer, that maintainer merges
# the first promotion with an admin bypass, which GitHub records as such.

[groups.omarchy]
description = "What Omarchy ships or depends on: the desktop, its tools and their dependencies"
maintainers = ["firemanxbr"]

[groups.community]
description = "Everything else contributors bring to the pool"
maintainers = ["firemanxbr"]
