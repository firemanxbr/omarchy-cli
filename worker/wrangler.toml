name = "omarchy-repo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "34f1918ac9ca522150a1830ea9b61a40"

# Custom domain on firemanxbr.org (zone must exist in this account).
routes = [
  { pattern = "pkgs.firemanxbr.org", custom_domain = true }
]

[observability]
enabled = true

# Metadata: package graph. Create with `wrangler d1 create omarchy-repo`
# and paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "omarchy-repo"
database_id = "e2f04e65-465c-4170-8750-69061f846b9b"
migrations_dir = "migrations"

# Pool objects: pool/<sha256>.pkg.tar.zst (+ .sig); generated databases: releases/<id>/...
# Create with `wrangler r2 bucket create omarchy-packages`.
[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "omarchy-packages"

[vars]
DEFAULT_RING = "stable"

# Secrets (set with `wrangler secret put <NAME>`):
#   PUBLISH_TOKEN  — bearer token required by the CI publisher on PUT /api/v1/packages
